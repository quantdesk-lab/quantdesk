[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantdesk"
version = "0.1.0"
description = "Fee-first quant research toolkit: adapted formulaic alphas, TSMOM, microstructure observables, a no-lookahead backtest engine and an IC/decay research board -- stdlib core, synthetic demo data."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = []
keywords = ["quant", "backtest", "factors", "alpha", "tsmom", "microstructure"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business :: Financial :: Investment",
]

[project.optional-dependencies]
# tzdata: pyarrow needs an IANA zone database for timezone-aware timestamps and Windows ships none.
lake = ["pyarrow>=17", "tzdata; sys_platform == 'win32'"]
dev = ["pytest>=8", "pyarrow>=17", "tzdata; sys_platform == 'win32'", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# src layout: let `pytest` work from a fresh clone before `pip install -e .`
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Pinned rule set so lint results do not change with ruff releases.
select = ["E4", "E7", "E9", "F"]
# E741: the factor code names OHLC bars (o, h, l, c) after the columns on purpose.
ignore = ["E741"]
