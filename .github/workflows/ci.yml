name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Install (dev extras)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest -q
      - name: README test count matches the collector (docs/HONESTY.md rule 10)
        run: python scripts/check_test_count.py

  core-no-extras:
    name: core imports with no extras
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install core only (no extras, no pyarrow)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Prove the core is standard-library only
        run: |
          python - <<'PY'
          import importlib, sys
          mods = [
              "quantdesk.factors.alpha101",
              "quantdesk.factors.tsmom",
              "quantdesk.factors.quant",
              "quantdesk.factors.microstructure",
              "quantdesk.backtest.engine",
              "quantdesk.backtest.metrics",
              "quantdesk.policy",
          ]
          for m in mods:
              importlib.import_module(m)
              print("ok", m)
          assert "pyarrow" not in sys.modules, "pyarrow must not be imported by the core"
          print("core imports clean; pyarrow absent from sys.modules")
          PY
      - name: Run the pure-stdlib test files (pytest is the only extra)
        run: |
          python -m pip install "pytest>=8"
          pytest -q \
            tests/test_alpha101.py \
            tests/test_factors.py \
            tests/test_quant.py \
            tests/test_technical.py \
            tests/test_policy.py \
            tests/test_backtest_engine.py \
            tests/test_weight_engine.py \
            tests/test_backtest_metrics.py \
            tests/test_backtest_signals.py \
            tests/test_reference_strategies.py

  forbidden-scan:
    name: leak scan (generic detectors + private word list)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The public scanner carries only generic detectors (CJK, personal-path
      # shapes, secret shapes, artefacts). The project-specific word list is
      # NOT in the repository: it arrives through the SCAN_PRIVATE_PATTERNS
      # secret (one regex or JSON entry per line) and is written to a temp file.
      # Without the secret the generic detectors still run.
      - name: Scan the tree (strict)
        env:
          PRIVATE_PATTERNS: ${{ secrets.SCAN_PRIVATE_PATTERNS }}
        run: |
          if [ -n "$PRIVATE_PATTERNS" ]; then
            printf '%s\n' "$PRIVATE_PATTERNS" > "$RUNNER_TEMP/private_patterns.txt"
            export SCAN_PRIVATE_PATTERNS="$RUNNER_TEMP/private_patterns.txt"
          else
            echo "::notice::SCAN_PRIVATE_PATTERNS secret not set; generic detectors only"
          fi
          python scripts/scan_forbidden.py . --strict

  gitleaks:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
